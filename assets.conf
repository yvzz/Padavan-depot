# 同步清单: 名称|源仓库|资产文件名|目标目录|[锁定版本]
# 以 # 开头为注释。新增一个包只需照格式加一行, 不用改脚本。
# 规则: 只挑"正式 release"(跳过 draft / prerelease)里存在该资产的最新版本。
#       源仓库填 direct 时, 资产文件名位置改填完整直链。
#       第 5 字段填版本号可锁定, 不跟随 latest。
#
# MT7621(K2P/R2100) 是 mipsel 硬浮点, 客户端资产统一用 linux_mipsle_client.tar.gz。

# ---------- NPC 客户端: 两个分支版本, 服务端是哪个分支就下载哪个 ----------
# 分支一: yisier/nps —— v0.26.x, 上游停更版本, 与 0.26.x 的 nps 服务端配套(默认)
npc-yisier|yisier/nps|linux_mipsle_client.tar.gz|npc/yisier

# 分支二: djylb/nps —— v0.34.x, 社区二次维护版, 需 0.34.x 服务端才连得上
npc-djylb|djylb/nps|linux_mipsle_client.tar.gz|npc/djylb

# ---------- 以后要加的其它包, 照下面格式加即可 ----------
# easytier|EasyTier/EasyTier|easytier-linux-mipsel-v2.6.4.zip|easytier/mipsel
# 某直链包|direct|https://example.com/foo.tar.gz|foo
